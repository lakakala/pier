name: CI

on:
  push:
    branches: ['**', '!master']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/pier-controller/web/package-lock.json
      - name: Validate workflows and release helpers
        run: |
          bash scripts/check-workflows.sh
          python3 -m unittest discover -s scripts -p 'test_release.py' -v
          bash -n scripts/package-agent.sh scripts/package-controller.sh scripts/prepare-upgrade-fixtures.sh scripts/test-agent-auto-upgrade.sh scripts/test-agent-packages.sh scripts/test-controller-packages.sh scripts/check-workflows.sh
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build -p pier-controller --locked
      - name: Check embedded web assets
        working-directory: crates/pier-controller/web
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm run build:check
          npx playwright install --with-deps chromium
          npm test
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-diagnostics
          path: |
            crates/pier-controller/web/playwright-report/
            crates/pier-controller/web/test-results/
          retention-days: 7
