name: Packages

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: packages-master
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Push access is needed to include draft Releases in version allocation.
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      revision: ${{ steps.version.outputs.revision }}
      upgrade_revision: ${{ steps.version.outputs.upgrade_revision }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py resolve
      - id: targets
        run: python3 scripts/release.py matrix

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  agent:
    name: agent (${{ matrix.system }}, ${{ matrix.arch }})
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PIER_ARCH: ${{ matrix.arch }}
      PIER_SYSTEM: ${{ matrix.system }}
      PIER_FORMAT: ${{ matrix.format }}
      PACKAGE_REVISION: ${{ needs.metadata.outputs.revision }}
      UPGRADE_REVISION: ${{ needs.metadata.outputs.upgrade_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-environment
        id: environment
        with:
          system: ${{ matrix.system }}
          arch: ${{ matrix.arch }}
          service: agent
      - name: Build agent package and upgrade fixture
        env:
          PIER_IMAGE: ${{ steps.environment.outputs.image }}
        run: |
          mkdir -p target/ci-logs
          bash scripts/package-agent.sh --image "$PIER_IMAGE" --arch "$PIER_ARCH" --system "$PIER_SYSTEM" \
            --revision "$PACKAGE_REVISION" --output target/release/agent 2>&1 | tee target/ci-logs/agent.log
          bash scripts/prepare-upgrade-fixtures.sh agent "$PIER_ARCH" "$UPGRADE_REVISION" \
            target/fixtures/agent --system "$PIER_SYSTEM" 2>&1 | tee target/ci-logs/agent-fixtures.log
      - name: Prepare Ubuntu legacy version migration fixture
        if: matrix.system == 'ubuntu24.04'
        run: |
          mkdir -p target/fixtures/legacy-agent
          version=$(python3 scripts/release.py version)
          docker run --rm --pull=never --network=none --platform "linux/$PIER_ARCH" \
            -v "$PWD:/src:ro" -v "$PWD/target/fixtures/legacy-agent:/out" \
            "pier-agent-package-deb:$PIER_ARCH" python3 /src/scripts/prepare-legacy-agent-fixture.py \
            "/src/target/release/agent/pier-agent_${version}-${PACKAGE_REVISION}.ubuntu24.04_${PIER_ARCH}.deb" /out \
            2>&1 | tee target/ci-logs/agent-migration-fixture.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-agent-${{ matrix.system }}-${{ matrix.arch }}
          path: target/release/agent/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixtures-agent-${{ matrix.system }}-${{ matrix.arch }}
          path: target/fixtures/agent/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.system == 'ubuntu24.04'
        with:
          name: fixtures-legacy-agent-${{ matrix.system }}-${{ matrix.arch }}
          path: target/fixtures/legacy-agent/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs-agent-${{ matrix.system }}-${{ matrix.arch }}
          path: target/ci-logs/
          retention-days: 7

  controller:
    name: controller (${{ matrix.system }}, ${{ matrix.arch }})
    needs: [metadata, agent]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PIER_ARCH: ${{ matrix.arch }}
      PIER_SYSTEM: ${{ matrix.system }}
      PIER_FORMAT: ${{ matrix.format }}
      PACKAGE_REVISION: ${{ needs.metadata.outputs.revision }}
      UPGRADE_REVISION: ${{ needs.metadata.outputs.upgrade_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-environment
        id: environment
        with:
          system: ${{ matrix.system }}
          arch: ${{ matrix.arch }}
          service: controller
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-agent-*
          path: target/release/agent
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fixtures-agent-*
          path: target/fixtures/agent
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.system == 'ubuntu24.04'
        with:
          name: fixtures-legacy-agent-${{ matrix.system }}-${{ matrix.arch }}
          path: target/fixtures/legacy-agent
      - name: Build controller package and upgrade fixture
        env:
          PIER_IMAGE: ${{ steps.environment.outputs.image }}
        run: |
          mkdir -p target/ci-logs
          bash scripts/package-controller.sh --image "$PIER_IMAGE" --arch "$PIER_ARCH" --system "$PIER_SYSTEM" \
            --revision "$PACKAGE_REVISION" --agent-packages target/release/agent \
            --output target/release/controller 2>&1 | tee target/ci-logs/controller.log
          bash scripts/prepare-upgrade-fixtures.sh controller "$PIER_ARCH" "$UPGRADE_REVISION" \
            "target/fixtures/controller/$PIER_SYSTEM/$PIER_ARCH" --system "$PIER_SYSTEM" \
            --agent-packages target/fixtures/agent 2>&1 | tee target/ci-logs/controller-fixtures.log
      - name: Test native installation and automatic upgrade
        run: |
          mkdir -p target/native-packages
          cp target/release/agent/*.deb target/release/agent/*.rpm target/native-packages/
          cp target/release/controller/*."$PIER_FORMAT" target/native-packages/
          for pier_mode in agent_to_controller controller_to_agent controller_to_agent_socks5; do
            PIER_TEST_CONNECTION_MODE="$pier_mode" bash scripts/test-agent-auto-upgrade.sh "$PIER_ARCH" \
              --system "$PIER_SYSTEM" --revision "$PACKAGE_REVISION" \
              --packages target/native-packages --fixtures "target/fixtures/controller/$PIER_SYSTEM" \
              --legacy-packages target/fixtures/legacy-agent \
              --logs "target/ci-logs/$pier_mode" 2>&1 | tee "target/ci-logs/native-$pier_mode.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-controller-${{ matrix.system }}-${{ matrix.arch }}
          path: target/release/controller/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 7
      - name: Save packaging and systemd logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs-controller-${{ matrix.system }}-${{ matrix.arch }}
          path: target/ci-logs/
          retention-days: 7

  assemble:
    needs: [metadata, controller]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGE_REVISION: ${{ needs.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.7.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          path: target/release-input
          merge-multiple: true
      - name: Verify native metadata, embedded bundles and checksums
        run: |
          python3 scripts/release.py assemble --revision "$PACKAGE_REVISION" \
            --input target/release-input --output target/release-assets
          cd target/release-assets
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pier-packages
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pier-packages
          path: release-assets
      - name: Publish complete release
        run: |
          python3 scripts/release.py publish --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" --input release-assets
