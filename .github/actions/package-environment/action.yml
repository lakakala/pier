name: Set up native package build
description: Prepare Docker, the AlmaLinux builder and architecture-specific Cargo caches
inputs:
  arch:
    description: Target architecture (amd64 or arm64)
    required: true
  service:
    description: Service being compiled (agent or controller)
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
      with:
        version: v29.7.2
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: docker/rust-almalinux8.Dockerfile
        platforms: linux/${{ inputs.arch }}
        tags: pier-builder-rust:almalinux8
        load: true
        provenance: false
        cache-from: type=gha,scope=pier-rust-almalinux8-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=pier-rust-almalinux8-${{ inputs.arch }}
    - id: image
      shell: bash
      env:
        PIER_ARCH: ${{ inputs.arch }}
      run: |
        image_id=$(docker image inspect --platform "linux/$PIER_ARCH" --format '{{.Id}}' pier-builder-rust:almalinux8)
        echo "id=${image_id#sha256:}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          target/${{ inputs.service }}-builds/${{ inputs.arch }}
          target/${{ inputs.service }}-packages-cache-${{ inputs.arch }}
        key: native-${{ inputs.service }}-${{ inputs.arch }}-${{ steps.image.outputs.id }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          native-${{ inputs.service }}-${{ inputs.arch }}-${{ steps.image.outputs.id }}-${{ hashFiles('Cargo.lock') }}-
    - shell: bash
      run: cargo fetch --locked
