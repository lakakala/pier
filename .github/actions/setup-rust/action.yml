name: Set up Pier Rust
description: Use the same pinned Rust version as the native package builder
runs:
  using: composite
  steps:
    - id: toolchain
      shell: bash
      run: |
        version=$(sed -n 's/^ARG RUST_VERSION=//p' docker/rust-almalinux8.Dockerfile)
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        for dockerfile in docker/rust-almalinux9.Dockerfile docker/rust-ubuntu2404.Dockerfile; do
          [ "$(sed -n 's/^ARG RUST_VERSION=//p' "$dockerfile")" = "$version" ] || {
            echo "Rust version differs in $dockerfile" >&2
            exit 1
          }
        done
        rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cargo/registry
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
