schema: 2
name: demo-go
version: "{{ VERSION }}"
variables:
  VERSION: {default: "1.0.0"}
  DB_HOST: {}
  PORT: {default: "8080"}
proxy:
  enabled: false
source:
  type: git
  repo: https://example.com/your/demo-go.git
  ref: "v{{ VERSION }}"
build:
  language: go
  commands:
    - go build -o /output/demo-go .
files:
  - from: demo-go
    to: bin/demo-go
    executable: true
service:
  command: [bin/demo-go, --config, configs/app.toml]
  working_dir: .
