# Generated by pier-agent init after selecting Controller → Agent.
# Enter the controller-reachable address in the Web enrollment page.
agent_id: replace-with-enrolled-agent-id
token_file: agent.token
connection_mode: controller_to_agent
listen: 0.0.0.0:7444
state_dir: /var/lib/pier-agent
heartbeat_seconds: 15
runtime:
  startup_grace_seconds: 10
  stop_timeout_seconds: 30
